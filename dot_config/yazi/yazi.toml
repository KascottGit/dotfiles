[opener]
image = [
    { run = 'feh -F -Z "$@"', orphan = true, desc = "feh" }
]
media = [
    { run = 'vlc "$@"', orphan = true, desc = "VLC" }
]
vscode = [
    { run = 'code -n "$@"', orphan = true, desc = "VS Code (New Window)" }
]
tdf = [
    { run = 'echo "0=$0 | 1=$1 | @=$@" > /tmp/yazi-args.txt', orphan = true, desc = "debug" }
]

[open]
rules = [
    # Images -> feh
    { mime = "image/*", use = "image" },

    # Video & Audio -> VLC
    { mime = "video/*", use = "media" },
    { mime = "audio/*", use = "media" },

    # PDF -> tdf in a new kitty window
    { mime = "application/pdf", use = "tdf" },

    # Fallback for all other files -> VS Code
    { url = "*", use = "vscode" }
]